name: Android Beta

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  android-beta:
    name: android-beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm vitest run --passWithNoTests
      - name: Android Expo export
        run: npx expo export --platform android --output-dir dist-android-ci
